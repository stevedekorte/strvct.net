<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="700px" height="290px" viewBox="-1 -1 702 292" role="img" aria-labelledby="title desc">
  <title id="title">Anchored Tabs (Wide)</title>
  <desc id="desc">A row of tabs A to E over three side-by-side panes. Open tabs A, C and E each sit at the top left of their own pane; closed tabs B and D sit at the right end of the segment before the next open tab. Tab A is pinned. Draggable dividers separate the panes, and each pane has a pin control.</desc>
