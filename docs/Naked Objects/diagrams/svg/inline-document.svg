    <rect x="0" y="30" width="130" height="300" stroke-dasharray="3 3"/>
    <rect x="10" y="40" width="110" height="30"/>
    <rect x="10" y="80" width="110" height="30"/>
    <rect x="10" y="120" width="110" height="30"/>
    <rect x="130" y="30" width="440" height="300"/>
    <rect x="570" y="30" width="130" height="300" stroke-dasharray="3 3"/>
    <rect x="580" y="40" width="110" height="280"/>
    <line x1="142" y1="57" x2="558" y2="57"/>
    <rect x="142" y="64" width="132" height="20"/>
    <rect x="284" y="64" width="132" height="20"/>
    <rect x="426" y="64" width="132" height="20"/>
    <rect x="138" y="94" width="140" height="226" stroke-dasharray="3 3"/>
    <rect x="280" y="94" width="140" height="226" stroke-dasharray="3 3"/>
    <rect x="422" y="94" width="140" height="226" stroke-dasharray="3 3"/>
    <line x1="142" y1="117" x2="274" y2="117"/>
    <rect x="142" y="122" width="132" height="20"/>
    <rect x="142" y="148" width="132" height="20"/>
    <rect x="142" y="174" width="132" height="20"/>
    <line x1="142" y1="227" x2="274" y2="227"/>
    <rect x="142" y="232" width="132" height="20"/>
    <rect x="142" y="258" width="132" height="20"/>
    <line x1="284" y1="117" x2="416" y2="117"/>
    <rect x="284" y="122" width="132" height="20"/>
    <rect x="292" y="172" width="124" height="20"/>
    <rect x="292" y="198" width="124" height="20"/>
    <rect x="284" y="230" width="132" height="20"/>
    <line x1="426" y1="117" x2="558" y2="117"/>
