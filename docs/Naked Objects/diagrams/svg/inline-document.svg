<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="700px" height="330px" viewBox="-1 -1 702 332" role="img" aria-labelledby="title desc">
  <title id="title">Inline Document</title>
  <desc id="desc">A node laid out inline: its subnodes become sections flowing in columns, one section spans every column, a section holds a nested group, and a tile that is not inlined opens the next column.</desc>
  <defs/>
  <g fill="none" stroke="#000000" stroke-width="1" vector-effect="non-scaling-stroke">
